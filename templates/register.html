{% extends "base.html" %}
{% block title %}Register - AEGIS-SEAL{% endblock %}
{% block content %}
<div class="card">
  <h2>Create account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" required>
    <label>User id</label>
    <input type="text" name="username" pattern="[A-Za-z0-9_]{3,20}" title="3 to 20 letters, numbers or underscore" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
