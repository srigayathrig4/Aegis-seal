<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AEGIS-SEAL{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('home') }}">AEGIS-SEAL</a>
    <div>
  {% if session.user_id %}
    <a href="{{ url_for('upload') }}">Upload</a>
    <a href="{{ url_for('check_text') }}">Check text</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  {% else %}
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('register') }}">Register</a>
  {% endif %}
</div>
  </nav>
  <main>{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="{{ 'error' if category == 'error' else 'success' }}">{{ message }}</p>
  {% endfor %}
{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
