{% extends "base.html" %}
{% block title %}Upload - AEGIS-SEAL{% endblock %}
{% block content %}
<div class="card">
  <h2>Upload a file</h2>
  <form method="post" enctype="multipart/form-data">
    <label>Choose a file (.txt, .png, .jpg, up to 5 MB)</label>
    <input type="file" name="file" required>
    <button class="btn" type="submit">Upload</button>
  </form>
</div>
{% endblock %}
